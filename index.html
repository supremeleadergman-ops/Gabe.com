<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
            gap: 40px;
        }

        input {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            border: none;
            outline: none;
            animation: flash 0.3s infinite;
            background: transparent;
        }

        @keyframes flash {
            0%   { color: black; background-color: white; }
            50%  { color: white; background-color: black; }
            100% { color: black; background-color: white; }
        }

        button {
            font-size: 24px;
            font-weight: bold;
            padding: 15px 40px;
            cursor: pointer;
            border: 3px solid black;
            border-radius: 8px;
            background-color: white;
            color: black;
        }

        button:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <input type="text" value="gabe">
    <button onclick="handleClick()">Click me</button>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let scratchyInterval = null;

        function playScratchy() {
            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1);
            }

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.value = 4000;

            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 3.0;

            source.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            source.start();
        }

        function sayIdiot() {
            const utterance = new SpeechSynthesisUtterance("idiot");
            utterance.pitch = 2.0;
            utterance.rate = 1.0;
            utterance.volume = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function handleClick() {
            sayIdiot();

            if (!scratchyInterval) {
                scratchyInterval = setInterval(playScratchy, 100);
            }
        }
    </script>
</body>
</html>
